# OMCC-MCP 配置文件示例
# Oh-My-ClaudeCode 多代理协作 MCP 服务器
# 请复制此文件到 ~/.omcc-mcp/config.toml 并填入你的配置

# ============================================================================
# Coder 配置（使用 claude CLI + 可配置后端）
# ============================================================================
[coder]
# Coder 工具可配置任意支持 Claude Code API 的模型后端
# 推荐使用 GLM-4.7 作为参考案例，也可选用其他模型（如 Minimax、DeepSeek 等）

# API 认证（必填）
# GLM 示例：从智谱 AI 平台获取 https://open.bigmodel.cn
api_token = "your-api-token"

# API 地址（必填，需支持 Claude Code API 协议）
base_url = "https://open.bigmodel.cn/api/anthropic"

# 模型名称（可选，默认 glm-4.7）
model = "glm-4.7"

# 是否启用 1m 扩展上下文（可选，默认 false）
# 启用后会在模型名称后添加 [1m] 后缀，如 glm-4.7[1m]
# 注意：需要后端模型支持 1m 上下文窗口
extended_context = false

# 额外环境变量（建议保留）
[coder.env]
CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC = "1"

# ============================================================================
# OpenCode CLI 相关代理模型配置
# 模型格式为 provider/model，如 google/gemini-3-pro-preview
# 需要先在 ~/.config/opencode/opencode.jsonc 中配置对应的 provider
# ============================================================================

# Gemini 通用代理（架构咨询、第二意见）
[gemini]
model = "google/gemini-3-pro-preview"

# Frontend 前端/UI 代理（设计、样式、动效）
[frontend]
model = "google/gemini-3-pro-preview"

# Librarian 研究代理（代码搜索、文档查询、网络研究）
[librarian]
model = "google/gemini-3-flash-preview"

# Looker 多模态代理（PDF、图片、图表分析）
[looker]
model = "google/gemini-3-flash-preview"

# ============================================================================
# Chore 杂务代理配置（使用 OpenCode CLI）
# ============================================================================

# Chore 杂务代理（简单重复任务）
# 使用 OpenCode CLI，model 格式为 provider/model
[chore]
# model = "anthropic/claude-sonnet-4-20250514"
