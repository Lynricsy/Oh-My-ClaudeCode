[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "omcc-mcp"
version = "0.1.0"
description = "Oh-My-ClaudeCode 多代理协作 MCP 服务器"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.20.0",
    "pydantic>=2.0",
]
authors = [
    { name = "OMCC-MCP Contributors" },
]
license = { text = "MIT" }
keywords = ["mcp", "fastmcp", "coder", "reviewer", "advisor", "claude", "opencode"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Lynricsy/Oh-My-ClaudeCode"

[project.scripts]
omcc-mcp = "omcc_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/omcc_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/omcc_mcp", "README.md", "LICENSE"]
